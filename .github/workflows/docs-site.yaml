on:
  push:
    branches: [main, master]
    paths:
      - 'r/**'
      - 'python/**'
      - 'prompts/**'
      - 'docs-site/**'
      - '.github/workflows/docs-site.yaml'
  workflow_dispatch: {}

name: docs-site.yaml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # --- R: set up R + pandoc + package dependencies EARLY. Quarto's
      # knitr engine requires a working Rscript to process get-started-r.qmd
      # (even for `eval: false` chunks), so R must be available before
      # `quarto render` runs below -- but the actual `pkgdown::build_site()`
      # call happens LATER, after `quarto render`, which clears its
      # output-dir (_site/) before rendering and would otherwise silently
      # wipe out the pkgdown site if built first. ---
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::gargle, local::.
          needs: website
          working-directory: r

      # --- Python: install the package so quartodoc can introspect its
      # docstrings for the API reference ---
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.12'

      - name: Install statlingo (Python) + quartodoc
        working-directory: python
        run: |
          uv venv
          uv pip install -e . chatlas pyyaml jupyter ipykernel statsmodels matplotlib seaborn google-genai
          # quartodoc's declared `griffe>=0.33` dependency resolves to a
          # too-new, API-incompatible griffe release by default; pin to the
          # last known-compatible major version (see docs-site/README.md).
          uv pip install quartodoc "griffe<1.0"

      # --- Quarto: generate the Python API reference, then render the
      # whole site (home, get-started pages, Python reference) ---
      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Build Python API reference (quartodoc)
        working-directory: docs-site
        run: |
          source ../python/.venv/bin/activate
          python3 -m quartodoc build

      - name: Render Quarto site
        working-directory: docs-site
        run: |
          source ../python/.venv/bin/activate
          quarto render .

      # --- R: build the pkgdown reference site directly into
      # docs-site/_site/r/, now that `quarto render` has already run. ---
      - name: Build pkgdown site into docs-site/_site/r
        working-directory: r
        run: pkgdown::build_site(pkg = ".", override = list(destination = "../docs-site/_site/r"))
        shell: Rscript {0}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
